name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - run: dotnet test VideoOptimiser.sln -c Release
      - run: >
          dotnet publish src/VideoOptimiser.Cli -p:PublishProfile=win-x64-aot
          -p:Version=0.0.0-ci -p:InformationalVersion=0.0.0-ci.${{ github.sha }}
          -o artifacts/ci
      - shell: pwsh
        run: ./scripts/smoke-test.ps1 -Executable artifacts/ci/video-optimiser.exe -ExpectedVersion 0.0.0-ci.${{ github.sha }}
      - uses: ./.github/actions/e2e
        with:
          executable: artifacts/ci/video-optimiser.exe
