name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - run: dotnet test VideoOptimiser.sln -c Release
      - run: >
          dotnet publish src/VideoOptimiser.Cli -p:PublishProfile=win-x64-aot
          -p:Version=0.0.0-ci -p:InformationalVersion=0.0.0-ci.${{ github.sha }}
          -o artifacts/ci
      - shell: pwsh
        run: ./scripts/smoke-test.ps1 -Executable artifacts/ci/video-optimiser.exe -ExpectedVersion 0.0.0-ci.${{ github.sha }}
      - uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/media-tools
          key: media-tools-${{ hashFiles('scripts/install-media-tools.ps1') }}
      - shell: pwsh
        run: ./scripts/install-media-tools.ps1 -Destination "$env:RUNNER_TEMP/media-tools" | Add-Content -LiteralPath $env:GITHUB_PATH
      - shell: pwsh
        run: ./scripts/e2e-test.ps1 -Executable artifacts/ci/video-optimiser.exe
