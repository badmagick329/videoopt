name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # A tag on a branch or a stray commit never ran CI on main, so only a commit main holds is released.
      - name: Check the tag is on main
        shell: pwsh
        run: |
          git merge-base --is-ancestor '${{ github.sha }}' origin/main
          if ($LASTEXITCODE -ne 0) { throw "Tag ${{ github.ref_name }} points at ${{ github.sha }}, which isn't on main." }
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      # A tag pushed by hand skips release.ps1, so the release gates on the same checks itself.
      - name: Test
        run: dotnet test VideoOptimiser.sln -c Release
      - name: Build and package
        shell: pwsh
        run: |
          $tag = '${{ github.ref_name }}'
          $version = $tag.Substring(1)
          $commit = '${{ github.sha }}'.Substring(0, 7)
          dotnet publish src/VideoOptimiser.Cli -p:PublishProfile=win-x64-aot -p:Version=$version -p:AssemblyVersion=$version -p:FileVersion=$version.0 -p:InformationalVersion=$version+$commit -o artifacts/publish
          if ($LASTEXITCODE -ne 0) { throw 'AOT publish failed.' }
          ./scripts/smoke-test.ps1 -Executable artifacts/publish/video-optimiser.exe -ExpectedVersion $version
          $packageName = "video-optimiser-$tag-win-x64"
          New-Item -ItemType Directory -Path "artifacts/$packageName" | Out-Null
          Copy-Item artifacts/publish/video-optimiser.exe "artifacts/$packageName/"
          Copy-Item README.md, LICENSE, .env.example "artifacts/$packageName/"
          # The README links to docs/, and the default bootstrapScriptPath is scripts/ beside a config next to the exe.
          Copy-Item docs "artifacts/$packageName/docs" -Recurse
          New-Item -ItemType Directory -Path "artifacts/$packageName/scripts" | Out-Null
          Copy-Item scripts/bootstrap-remote-worker.sh "artifacts/$packageName/scripts/"
          Compress-Archive -Path "artifacts/$packageName/*" -DestinationPath "artifacts/$packageName.zip"
          $hash = (Get-FileHash "artifacts/$packageName.zip" -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content -LiteralPath "artifacts/$packageName.zip.sha256" -Value "$hash  $packageName.zip" -NoNewline
          $changelog = Get-Content CHANGELOG.md -Raw
          $match = [regex]::Match($changelog, "(?ms)^## \[$([regex]::Escape($version))\][^\r\n]*\r?\n(?<notes>.*?)(?=^## |\z)")
          if (-not $match.Success) { throw "No changelog entry found for $version." }
          Set-Content -LiteralPath artifacts/release-notes.md -Value $match.Groups['notes'].Value.Trim() -NoNewline
      # CI's e2e runs in parallel on the same push and can't stop this workflow, so the release runs its own on the exe it ships.
      - name: End-to-end test
        uses: ./.github/actions/e2e
        with:
          executable: artifacts/publish/video-optimiser.exe
      - name: Create GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = '${{ github.ref_name }}'
          $packageName = "video-optimiser-$tag-win-x64"
          gh release create $tag "artifacts/$packageName.zip" "artifacts/$packageName.zip.sha256" --title "VideoOptimiser $tag" --notes-file artifacts/release-notes.md
